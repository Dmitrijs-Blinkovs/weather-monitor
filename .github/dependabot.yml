# Weekly dependency updates, grouped so that related packages move together in one pull request.
# Paused (ADR 0019): open-pull-requests-limit 0 stops version-update pull requests while nobody maintains the project.
# To resume, set it back to 5 (nuget, npm) and remove it (github-actions). Security updates are a repository setting.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a few days before adopting them (supply-chain attacks are usually caught quickly).
    cooldown:
      default-days: 3
    open-pull-requests-limit: 0
    groups:
      dotnet-platform:
        patterns: ["Microsoft.AspNetCore.*", "Microsoft.EntityFrameworkCore*", "Microsoft.Extensions.*", "System.*"]
      azure-functions:
        patterns: ["Microsoft.Azure.Functions.*"]
      testing:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "Microsoft.Testing.*", "NSubstitute*", "Shouldly"]

  - package-ecosystem: npm
    directory: /src/weather-monitor.client
    schedule:
      interval: weekly
    # Let new releases age a few days before adopting them (supply-chain attacks are usually caught quickly).
    cooldown:
      default-days: 3
    open-pull-requests-limit: 0
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*", "react-router"]
      tooling:
        patterns: ["vite", "@vitejs/*", "vitest", "@vitest/*", "typescript", "typescript-eslint", "eslint*", "@eslint/*", "globals"]
      testing:
        patterns: ["@testing-library/*", "jsdom", "@playwright/test", "@axe-core/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a few days before adopting them (supply-chain attacks are usually caught quickly).
    cooldown:
      default-days: 3
    open-pull-requests-limit: 0
