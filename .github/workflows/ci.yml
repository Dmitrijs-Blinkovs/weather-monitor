name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A push and the pull request for the same branch share one group, so only the newest run survives.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CLIENT_DIR: src/weather-monitor.client

jobs:
  backend:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      # The web project references the React project (.esproj), so the .NET build needs Node and the npm packages.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.CLIENT_DIR }}/package-lock.json

      - name: Install front-end packages
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm ci

      - name: Build (warnings are errors)
        run: dotnet build WeatherMonitor.slnx --configuration Release

      - name: Test with coverage
        run: >
          dotnet test --solution WeatherMonitor.slnx --configuration Release --no-build
          --coverage --coverage-output-format cobertura --report-trx

      - name: Coverage report
        if: ${{ !cancelled() }}
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: TestResults/*.cobertura.xml
          targetdir: coverage-report
          reporttypes: MarkdownSummaryGithub;Cobertura
          assemblyfilters: +WeatherMonitor.*;-*.Tests
          classfilters: -WeatherMonitor.Infrastructure.Persistence.Migrations.*

      - name: Publish coverage summary
        if: ${{ !cancelled() }}
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-test-results
          path: |
            TestResults/*.trx
            coverage-report/
          retention-days: 14

  frontend:
    name: Front-end lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.CLIENT_DIR }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.CLIENT_DIR }}/package-lock.json

      - run: npm ci
      - name: Fail on known high or critical vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build # type-checks app, tests and e2e (tsc -b) and builds the production bundle

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: ${{ env.CLIENT_DIR }}/coverage/
          retention-days: 14

  infra:
    name: Infrastructure templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Compile and lint Bicep (warnings are errors)
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null 2> bicep.log || { cat bicep.log; exit 1; }
          if grep -q "Warning" bicep.log; then cat bicep.log; exit 1; fi

  migrations:
    name: Migrations on SQL Server
    runs-on: ubuntu-latest
    env:
      # Throwaway password for an ephemeral CI container; not a secret.
      SA_PASSWORD: Ci-Only-Throwaway-9f3
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Ci-Only-Throwaway-9f3
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -b -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - run: dotnet tool restore

      # dotnet ef does not restore a fresh checkout (NETSDK1004: project.assets.json not found); build once instead.
      - name: Build the migrations project
        run: dotnet build src/WeatherMonitor.Infrastructure

      # The unit tests build the schema from the model on SQLite; this runs the real migrations on SQL Server,
      # including the SQL Server-only parts (INCLUDE columns, char(2)), then rolls everything back and applies it again.
      - name: Apply, roll back and re-apply all migrations
        run: |
          connection="Server=localhost,1433;Database=WeatherMonitorCi;User Id=sa;Password=$SA_PASSWORD;TrustServerCertificate=True"
          ef() { dotnet ef database update "$@" --no-build --project src/WeatherMonitor.Infrastructure --startup-project src/WeatherMonitor.Infrastructure --connection "$connection"; }
          ef
          ef 0
          ef

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.CLIENT_DIR }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.CLIENT_DIR }}/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            ${{ env.CLIENT_DIR }}/playwright-report/
            ${{ env.CLIENT_DIR }}/test-results/
          retention-days: 14
