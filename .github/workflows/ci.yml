name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/weather-monitor.client/package-lock.json

      - name: Front end - install
        working-directory: src/weather-monitor.client
        run: npm ci

      - name: Front end - lint
        working-directory: src/weather-monitor.client
        run: npm run lint

      - name: Front end - test
        working-directory: src/weather-monitor.client
        run: npm test

      - name: Front end - build
        working-directory: src/weather-monitor.client
        run: npm run build

      - name: .NET - build
        run: dotnet build WeatherMonitor.slnx --configuration Release

      - name: .NET - test
        run: dotnet test --solution WeatherMonitor.slnx --configuration Release --no-build
